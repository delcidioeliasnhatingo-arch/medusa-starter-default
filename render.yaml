# Render Blueprint for the AVEART Medusa API.
# Uses Neon PostgreSQL (external DATABASE_URL) to avoid Render's expiring free Postgres.
# Render Free web services may sleep when idle; the free Redis instance is cache-only.
services:
  - type: web
    name: aveart-medusa-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: corepack enable && yarn install --immutable && yarn build
    startCommand: yarn medusa db:migrate && yarn start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.0
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: aveart-medusa-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: MEDUSA_WORKER_MODE
        value: shared
      - key: STORE_CORS
        sync: false
      - key: ADMIN_CORS
        value: https://medusa-starter-default-aveart.vercel.app,https://medusa-starter-default-beta.vercel.app
      - key: AUTH_CORS
        value: https://medusa-starter-default-aveart.vercel.app,https://medusa-starter-default-beta.vercel.app

  - type: keyvalue
    name: aveart-medusa-redis
    plan: free
    region: frankfurt
    ipAllowList: []
