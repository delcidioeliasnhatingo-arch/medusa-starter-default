# Render Blueprint for the AVEART Medusa API.
# Free resources are for testing only: Render Free Postgres expires after 30 days,
# and Free Key Value does not persist data. Upgrade before accepting real orders.
services:
  - type: web
    name: aveart-medusa-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: corepack enable && yarn install --immutable && yarn build
    startCommand: yarn medusa db:migrate && yarn start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: aveart-medusa-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: aveart-medusa-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: MEDUSA_WORKER_MODE
        value: shared
      - key: STORE_CORS
        value: http://localhost:8000
      - key: ADMIN_CORS
        value: https://medusa-starter-default-aveart.vercel.app,https://medusa-starter-default-beta.vercel.app
      - key: AUTH_CORS
        value: https://medusa-starter-default-aveart.vercel.app,https://medusa-starter-default-beta.vercel.app
      - key: MEDUSA_BACKEND_URL
        fromService:
          name: aveart-medusa-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: keyvalue
    name: aveart-medusa-redis
    plan: free
    region: frankfurt
    ipAllowList: []

databases:
  - name: aveart-medusa-postgres
    plan: free
    region: frankfurt
    databaseName: aveart_medusa
    user: aveart_medusa
